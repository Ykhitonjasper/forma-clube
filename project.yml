name: FormaClube
options:
  bundleIdPrefix: com.merinsylas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: FormaClube/Info.plist
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"
    PRODUCT_BUNDLE_IDENTIFIER: com.merinsylas.FormaClube
    PRODUCT_NAME: FormaClube
    DEVELOPMENT_TEAM: "Z277NR45Q9"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_MACCATALYST: NO
targets:
  FormaClube:
    type: application
    platform: iOS
    sources:
      - path: FormaClube
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
    resources:
      - path: FormaClube/Assets.xcassets
      - path: FormaClube/PrivacyInfo.xcprivacy
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: FormaClube
        PRODUCT_BUNDLE_IDENTIFIER: com.merinsylas.FormaClube
        PRODUCT_DISPLAY_NAME: FormaClube
        CODE_SIGN_ENTITLEMENTS: Config/FormaClube.entitlements
        DEVELOPMENT_TEAM: "Z277NR45Q9"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  FormaClubeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FormaClubeUITests
    dependencies:
      - target: FormaClube
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.merinsylas.FormaClube.uitests
        PRODUCT_NAME: FormaClubeUITests
        PRODUCT_MODULE_NAME: FormaClubeUITests
        DEVELOPMENT_TEAM: "Z277NR45Q9"
        TEST_TARGET_NAME: FormaClube
        CODE_SIGN_ENTITLEMENTS: ""

schemes:
  FormaClube:
    build:
      targets:
        FormaClube: all
        FormaClubeUITests: [test]
    test:
      targets:
        - FormaClubeUITests
